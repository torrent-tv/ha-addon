name: Main

# Every push to main checks the add-on and builds its image, then releases it when
# the Conventional Commits since the last tag ask for one: the version in
# config.yaml and the changelog heading are written, committed and tagged. Home
# Assistant reads the add-on from this repository, so that push is the release.
# A proxy release arrives here as `fix(proxy)`/`feat(proxy): install proxy <v>`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release step
        type: choice
        options: [auto, patch, minor]
        default: auto

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    # The commit check lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    # A newer push to a pull request makes its older checks pointless; every push to
    # main gets a group of its own, so no check of main is ever replaced.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # One step per check, so the run shows which check ran and which one failed.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Commit messages follow Conventional Commits
        uses: wagoid/commitlint-github-action@v6.2.1
      - name: No secrets in commits
        uses: torrent-tv/.github/actions/check-secrets@main
      - name: Branch name names a task
        if: github.event_name == 'pull_request'
        run: '[[ "$GITHUB_HEAD_REF" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)/ttv-[1-9][0-9]*-[a-z0-9][a-z0-9.-]*$ ]]'
      # actionlint 1.7.12 predates three documented things; drop each ignore once
      # actionlint knows it: the `queue` key of `concurrency` (queue: max keeps every
      # pending run), the `ubuntu-26.04` runner label, and the `client-id` input of
      # actions/create-github-app-token, which replaces `app-id`.
      # The runner passes `args` to docker without shell quoting, so a space inside a
      # pattern is written `\s` and a quote `.` (each pattern is a regular expression).
      - name: Workflows are valid
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: >-
            -color
            -ignore unexpected\skey\s.queue.\sfor\s.concurrency.\ssection
            -ignore label\s.ubuntu-26\.04.\sis\sunknown
            -ignore input\s.client-id.\sis\snot\sdefined\sin\saction\s.actions/create-github-app-token@
            -ignore missing\sinput\s.app-id.\swhich\sis\srequired\sby\saction\s.actions/create-github-app-token@
      - name: Pending changes have a changelog entry
        uses: torrent-tv/.github/actions/check-changelog@main
        with:
          changelog: torrent_tv_proxy/CHANGELOG.md
          version-file: torrent_tv_proxy/config.yaml
      - name: Read the pinned proxy version
        id: proxy
        run: echo "version=$(sed -n 's/^ARG PROXY_VERSION=//p' torrent_tv_proxy/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: The proxy version is published on npm
        uses: torrent-tv/.github/actions/npm-package-ready@main
        with:
          spec: "@torrent-tv/proxy@${{ steps.proxy.outputs.version }}"
          wait-minutes: 5

  lint:
    name: Add-on configuration
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./torrent_tv_proxy

  build:
    name: Image builds
    needs: checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the add-on image for amd64
        run: docker build --build-arg BUILD_VERSION=ci torrent_tv_proxy

  release:
    name: Release
    needs: [checks, lint, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    # Every release runs, one at a time, in the order the runs reach the queue.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: release
        uses: torrent-tv/.github/actions/release-prepare@main
        with:
          version-files: torrent_tv_proxy/config.yaml
          changelog: torrent_tv_proxy/CHANGELOG.md
          bump: ${{ inputs.bump || 'auto' }}
          # The standing task every release commit names (torrent-tv/meta#389).
          task: "#ttv-389"
      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/release-finish@main
        with:
          tag: ${{ steps.release.outputs.tag }}
          changelog: torrent_tv_proxy/CHANGELOG.md
          version-files: torrent_tv_proxy/config.yaml
          notes-file: ${{ steps.release.outputs.notes-file }}
          github-token: ${{ github.token }}
